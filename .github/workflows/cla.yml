name: CLA

# Runs on pull_request_target so it can comment on PRs from forks. It never checks out
# or runs PR code: it only reads the PR's commit authors and records signatures.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions: {}

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    permissions:
      actions: write # re-run the check after a contributor signs
      contents: write # store signatures on the cla-signatures branch
      pull-requests: write # comment on the pull request
      statuses: write # set the CLA commit status
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/crossmart-io/crossmart/blob/main/CLA.md
          branch: cla-signatures
          # "Claude *" matches AI co-author trailers (GitHub usernames cannot contain spaces).
          allowlist: yarivco88,dependabot[bot],Claude *
