# Security headers for every response. nginx drops server-level add_header lines in any
# location that sets its own, so each location in nginx.conf includes this file instead.
#
# Content-Security-Policy:
# - script-src: the bundle, plus the inline theme script in index.html by its hash. Editing that
#   script changes the hash: src/test/inline-script-hash.test.ts fails until this line is updated.
# - style-src 'unsafe-inline': sonner and the chart component inject <style> elements at runtime.
# - connect-src: __API_ORIGIN__ is replaced at image build time with the origin of VITE_API_URL,
#   the same value baked into the bundle (see the Dockerfile).
# - img-src https: product images come from channel and storage CDNs on any host.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-YwcPd9fpBPfU9AmsZHNcZgsE/OMjP4ICoETabjGWgZM='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' __API_ORIGIN__; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
